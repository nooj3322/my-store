<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — My Store</title>
<meta name="description" content="Complete your order with Cash on Delivery. No online payment required.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">

<a href="#" class="whatsapp-float" id="whatsapp-float" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">💬</a>
